services:
  php-fpm:
    build: ./docker/php
    volumes:
      - ./:/var/www/html
      - ./docker/php/Xdebug.ini:/usr/local/etc/php/conf.d/docker-php-xdebug.ini
    networks:
        - app-network
    depends_on:
        - postgres


  postgres:
    image: postgres:16
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    environment:
        - POSTGRES_DB=${DB_DATABASE}
        - POSTGRES_USER=${DB_USERNAME}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    networks:
        - app-network

  scheduler:
    build:
        context: .
        dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan schedule:work
    restart: always
    volumes:
        - .:/var/www/html
    depends_on:
        - php-fpm
        - postgres
        - rabbitmq
    networks:
        - app-network

  reports-worker:
      build:
          context: .
          dockerfile: docker/php/Dockerfile
      working_dir: /var/www/html
      command: >
          php artisan queue:work rabbitmq
          --queue=orders.reports.sales
          --tries=3
          --sleep=2
      restart: always
      volumes:
          - .:/var/www/html
      depends_on:
          - php-fpm
          - rabbitmq
      networks:
          - app-network

  redis:
      image: redis:7-alpine
      container_name: laravel-redis
      restart: unless-stopped
      ports:
          - "6379:6379"
      volumes:
          - ./docker/redis/data:/data
      networks:
          - app-network
  web:
      image: nginx
      ports:
          - "${PROJECT_PORT}:80"
      volumes:
          - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
          - ./:/var/www/html
      networks:
          - app-network
      depends_on:
          - php-fpm

  elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
      container_name: laravel-elasticsearch
      environment:
          - discovery.type=single-node # Режим одного узла для локальной разработки (для себя а не продакшен)
          - xpack.security.enabled=false
          - ES_JAVA_OPTS=-Xms512m -Xmx512m      # Ограничиваем память, чтобы не съел всю
      volumes:
          - es_data:/usr/share/elasticsearch/data # Сохраняем данные на случай перезапуска
      ports:
          - "9200:9200" # Пробрасываем порт, чтобы Laravel мог подключаться
      networks:
          - app-network
      healthcheck:
          test: [ "CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1" ]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 20s

  rabbitmq:
      image: rabbitmq:4-management
      container_name: rabbitmq
      restart: always
      environment:
          - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
          - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
          - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
      ports:
          - "5672:5672"
          - "15672:15672"
networks:
    app-network:
        driver: bridge

volumes:
    es_data:
        driver: local

